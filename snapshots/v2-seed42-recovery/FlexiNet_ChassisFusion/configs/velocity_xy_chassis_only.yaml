project:
  name: FlexiNet_ChassisFusion_velocity_xy_chassis_only
  version: 1.0
data:
  dataroot: /media/ps/AC78E69278E65B1A/zy/nuscenes
  version: v1.0-trainval
  split: train
  seq_len: 13
  img_height: 64
  img_width: 64
  cam_channel: CAM_FRONT
  can_bus_root: /media/ps/AC78E69278E65B1A/zy/nuscenes/can_bus
  allow_pose_fallback: false
  image_cache_size: 4096
  target_mode: velocity_xy
  chassis_mode: fair_chassis
  chassis_window_sec: 1.0
  chassis_hz: 20.0
  online_mode: true
  image_mode: gray
  flow_mode: none
  flow_root:
  geometry_mode: none
  base_velocity_source: zero_lateral
  eovm_base_root:
  physics_extra_root:
  physics_units_audited: false
  frame_cache_root: /media/ps/AC78E69278E65B1A/zy/nuscenes/precomputed_frames/CAM_FRONT_64x64_gray
model:
  pretrained_path: ../FlexiNet-main/pretrained_models/checkpoint_epoch_100_nuimage_L1_best.pth
  fusion_mode: residual
  output_dim: 2
  chassis_feature_dim: 8
  chassis_sequence_model: gru
  hidden_dim: 96
  dropout: 0.3
  freeze_backbone: true
  flow_feature_dim: 0
  geometry_input_dim: 0
  geometry_feature_dim: 0
  use_vision_branch: false
  use_kinematic_branch: true
  use_dynamics_branch: false
  branch_feature_dim: 64
  dynamics_feature_dim: 8
  save_gate_weights: false
train:
  batch_size: 32
  num_workers: 8
  prefetch_factor: 4
  epochs: 20
  shuffle_train: true
  eval_every: 1
  log_interval: 20
  learning_rate_head: 0.001
  learning_rate_backbone: 0.00003
  weight_decay: 0.0001
  use_amp: true
  seed: 42
  log_dir: runs/FlexiNet_ChassisFusion_velocity_xy/chassis_only
  results_dir: results_git/FlexiNet_ChassisFusion_velocity_xy/chassis_only
  save_dir: checkpoints/velocity_xy_chassis_only
  loss: velocity_smoothl1
  sigma_vx: 5.0
  sigma_vy: 0.5
  speed_loss_weight: 0.1
  beta_loss_weight: 0.0
  prior_loss_weight: 0.0
  smoothness_loss_weight: 0.0
  consistency_loss_weight: 0.0
  physics_prior_loss_weight: 0.0
  physics_correction_loss_weight: 0.0
  beta_vx_eps: 0.5
  grad_clip: 2.0
