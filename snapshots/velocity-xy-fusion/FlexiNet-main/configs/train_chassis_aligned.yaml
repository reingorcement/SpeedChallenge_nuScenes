project:
  name: FlexiNet-main
  version: pure_vision_chassis_aligned_train

data:
  dataroot: /mnt/sda2/zy/nuscenes
  version: v1.0-trainval
  seq_len: 13
  img_height: 64
  img_width: 64
  cam_channel: CAM_FRONT
  can_bus_root: /mnt/sda2/zy/nuscenes/can_bus
  filter_can_bus_scenes: true
  image_cache_size: 4096

model:
  pretrained_path: pretrained_models/checkpoint_epoch_100_nuimage_L1_best.pth
  input_channels: 1
  num_classes: 1
  strict_pretrained: true

train:
  batch_size: 16
  num_workers: 1
  epochs: 10
  shuffle_train: false
  learning_rate: 0.00003
  weight_decay: 0.0001
  eta_min: 0.000001
  use_gpu: true
  use_amp: true
  seed: 42
  log_dir: runs/FlexiNet-main-chassis-aligned
  results_dir: results_git/FlexiNet-main/chassis_aligned_train
  save_dir: checkpoints_chassis_aligned
  loss: smoothl1
  grad_clip: 2.0
