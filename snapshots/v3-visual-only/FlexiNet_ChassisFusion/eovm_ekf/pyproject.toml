[project]
name = "eovm-ekf-reproduction"
version = "0.1.0"
description = "Python reproduction of Seo and Kang 2025 EOVM-based EKF estimator core."
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
