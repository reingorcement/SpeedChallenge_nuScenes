project:
  name: FlexiNet_ChassisFusion_smoke_physics_hybrid
  version: 1.0
data:
  dataroot: /media/ps/AC78E69278E65B1A/zy/nuscenes
  version: v1.0-trainval
  split: train
  seq_len: 13
  img_height: 64
  img_width: 64
  cam_channel: CAM_FRONT
  can_bus_root: /media/ps/AC78E69278E65B1A/zy/nuscenes/can_bus
  allow_pose_fallback: false
  image_cache_size: 0
  target_mode: velocity_xy
  chassis_mode: fair_chassis
  chassis_window_sec: 1.0
  chassis_hz: 20.0
  online_mode: true
  image_mode: gray
  flow_mode: none
  flow_root:
  geometry_mode: none
  base_velocity_source: zero_lateral
  eovm_base_root:
  physics_extra_root:
  physics_units_audited: false
  can_max_age_sec: 0.25
  physics_extra_max_age_sec: 0.5
  frame_cache_root: /media/ps/AC78E69278E65B1A/zy/nuscenes/precomputed_frames/CAM_FRONT_64x64_gray
  max_scenes: 3
model:
  pretrained_path: ../FlexiNet-main/pretrained_models/checkpoint_epoch_100_nuimage_L1_best.pth
  fusion_mode: physics_residual_gated
  output_dim: 2
  chassis_feature_dim: 8
  chassis_sequence_model: gru
  hidden_dim: 32
  dropout: 0.1
  freeze_backbone: true
  flow_feature_dim: 0
  geometry_input_dim: 0
  geometry_feature_dim: 0
  use_vision_branch: true
  use_kinematic_branch: true
  use_dynamics_branch: false
  branch_feature_dim: 16
  dynamics_feature_dim: 8
  save_gate_weights: false
  physics_mass: 3052.0
  physics_wheelbase: 3.128
  physics_lf: 1.293
  physics_front_track: 1.600
  physics_rear_track: 1.740
train:
  batch_size: 4
  num_workers: 2
  prefetch_factor: 2
  epochs: 1
  shuffle_train: true
  eval_every: 1
  log_interval: 1
  limit_train_batches: 10
  limit_eval_batches: 5
  learning_rate_head: 0.001
  learning_rate_backbone: 0.00003
  weight_decay: 0.0001
  use_amp: true
  seed: 42
  log_dir: runs/smoke_physics_hybrid
  results_dir: results_git/smoke_physics_hybrid
  save_dir: checkpoints/smoke_physics_hybrid
  loss: knowledge_velocity
  sigma_vx: 5.0
  sigma_vy: 0.5
  speed_loss_weight: 0.1
  beta_loss_weight: 0.05
  prior_loss_weight: 0.0
  smoothness_loss_weight: 0.0
  consistency_loss_weight: 0.0
  physics_prior_loss_weight: 0.20
  physics_correction_loss_weight: 0.01
  beta_vx_eps: 0.5
  grad_clip: 2.0
