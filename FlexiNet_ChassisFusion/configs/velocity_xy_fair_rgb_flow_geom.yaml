project:
  name: FlexiNet_ChassisFusion_velocity_xy_fair_rgb_flow_geom
  version: 1.0

data:
  dataroot: /media/ps/AC78E69278E65B1A/zy/nuscenes
  version: v1.0-trainval
  split: train
  seq_len: 13
  img_height: 64
  img_width: 64
  cam_channel: CAM_FRONT
  can_bus_root: /media/ps/AC78E69278E65B1A/zy/nuscenes/can_bus
  allow_pose_fallback: false
  image_cache_size: 4096
  target_mode: velocity_xy
  chassis_mode: fair_chassis
  chassis_window_sec: 1.0
  chassis_hz: 20.0
  online_mode: false
  image_mode: rgb
  flow_mode: precomputed
  flow_root: /media/ps/AC78E69278E65B1A/zy/nuscenes/precomputed_flow/CAM_FRONT
  geometry_mode: basic
  base_velocity_source: zero_lateral
  eovm_base_root:

model:
  pretrained_path: ../FlexiNet-main/pretrained_models/checkpoint_epoch_100_nuimage_L1_best.pth
  fusion_mode: residual
  output_dim: 2
  chassis_feature_dim: 12
  chassis_sequence_model: gru
  hidden_dim: 96
  dropout: 0.3
  freeze_backbone: true
  flow_feature_dim: 12
  geometry_input_dim: 4
  geometry_feature_dim: 8

train:
  batch_size: 24
  num_workers: 8
  prefetch_factor: 4
  epochs: 30
  shuffle_train: true
  learning_rate_head: 0.001
  learning_rate_backbone: 0.00002
  weight_decay: 0.0001
  use_amp: true
  seed: 42
  log_dir: runs/FlexiNet_ChassisFusion_velocity_xy/fair_rgb_flow_geom
  results_dir: results_git/FlexiNet_ChassisFusion_velocity_xy/fair_rgb_flow_geom
  save_dir: checkpoints/velocity_xy_fair_rgb_flow_geom
  loss: velocity_smoothl1
  sigma_vx: 5.0
  sigma_vy: 0.5
  speed_loss_weight: 0.1
  grad_clip: 2.0
